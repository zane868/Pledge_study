# Pledge 运营后台 Nginx 配置
# 部署路径: /admin/
# 服务器: ubuntu@43.160.212.151

location = /admin {
    return 301 /admin/;
}

location /admin/ {
    alias /var/www/pledge-admin/current/;
    try_files $uri /admin/index.html;
    add_header Cache-Control "no-cache";
}

location ^~ /admin/assets/ {
    alias /var/www/pledge-admin/current/assets/;
    expires 30d;
    add_header Cache-Control "public, immutable";
}
